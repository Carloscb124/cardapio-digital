<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardápio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/bricolage-grotesque@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/figtree@5/index.css">
<link href="/css/app.css" rel="stylesheet"><link href="/css/menu.css" rel="stylesheet">
</head><body>
<div id="hero" class="hero"><div class="acct-bar"><button class="pill" id="ordersBtn" type="button"><i class="bi bi-receipt"></i> Meus pedidos</button><button class="pill" id="acctBtn" type="button"><i class="bi bi-person"></i> <span id="acctLabel">Entrar</span></button></div></div>
<div class="shop">
  <div id="head" class="shop-head"></div>
  <div id="status" class="mt-3"></div>
  <input id="search" class="form-control mt-3" type="search" placeholder="Buscar no cardápio">
  <nav id="chips" class="chips"></nav>
  <div id="list"><div class="text-center text-muted py-5">Carregando cardápio...</div></div>
</div>
<div class="cart-bar d-none" id="cartBar"><button class="btn btn-primary btn-lg w-100" id="openCart"><span><i class="bi bi-bag"></i> Ver carrinho (<span id="cartCount">0</span>)</span><strong id="cartTotal"></strong></button></div>

<div class="modal fade" id="prodModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="pmTitle"></h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
  <div class="modal-body" id="pmBody"></div>
  <div class="modal-footer justify-content-between"><div class="qty"><button id="pmMinus" type="button">−</button><strong id="pmQty">1</strong><button id="pmPlus" type="button">+</button></div><button class="btn btn-primary" id="pmAdd"></button></div>
</div></div></div>

<div class="modal fade" id="acctModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="acctTitle">Minha conta</h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div>
  <div class="modal-body" id="acctBody"></div>
</div></div></div>

<div class="offcanvas offcanvas-bottom" id="cartSheet" tabindex="-1">
  <div class="offcanvas-header"><h5 class="offcanvas-title">Seu pedido</h5><button class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button></div>
  <div class="offcanvas-body" id="cartBody"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/pix.js"></script>
<script src="/js/br.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/account.js"></script>
</body></html>
