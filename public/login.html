<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — Painel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet">
</head><body>
<div class="login-wrap"><div class="card login-card"><div class="card-body p-4">
  <div class="brand-dot"><i class="bi bi-shop"></i></div>
  <h1 class="h5 text-center mb-4">Acesse seu painel</h1>
  <div id="error" class="alert alert-danger py-2 d-none" role="alert"></div>
  <form id="form" novalidate>
    <div class="mb-3"><label class="form-label" for="email">E-mail</label>
      <input class="form-control" id="email" type="email" autocomplete="username" required></div>
    <div class="mb-3"><label class="form-label" for="password">Senha</label>
      <input class="form-control" id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary w-100" id="submit" type="submit">Entrar</button>
  </form>
  <p class="text-center small mt-3 mb-0">Ainda não tem conta? <a href="/cadastro">Criar conta</a> · <a href="/">Voltar ao início</a></p>
</div></div></div>
<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body></html>
