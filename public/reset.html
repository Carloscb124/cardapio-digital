<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/bricolage-grotesque@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/figtree@5/index.css">
<link href="/css/app.css" rel="stylesheet"></head>
<body><div class="login-wrap"><div class="card login-card"><div class="card-body p-4">
<h1 class="h5 text-center mb-3">Definir nova senha</h1>
<div id="msg" class="alert d-none py-2"></div>
<form id="form"><div class="mb-3"><label class="form-label" for="p1">Nova senha (mín. 8 caracteres)</label><input class="form-control" id="p1" type="password" minlength="8" autocomplete="new-password" required></div>
<div class="mb-3"><label class="form-label" for="p2">Repita a senha</label><input class="form-control" id="p2" type="password" minlength="8" autocomplete="new-password" required></div>
<button class="btn btn-primary w-100" id="go">Salvar senha</button></form>
<a class="d-block text-center mt-3 d-none" id="back" href="/login.html">Ir para o login</a>
</div></div></div>
<script src="/js/api.js"></script><script src="/js/reset.js"></script></body></html>
